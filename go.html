<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><title>GHub One — Mengalihkan…</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:system-ui;background:#0b0f1a;color:#e8edf9;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.box{text-align:center;max-width:420px;padding:24px}.logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#5b8cff,#a97aff);display:inline-flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;margin-bottom:14px}
.mut{color:#8b96b5;font-size:13px;margin-top:10px;word-break:break-all}a{color:#7aa2ff}</style>
</head>
<body>
<div class="box">
  <div class="logo">G</div>
  <h2>Link afiliasi GHub One</h2>
  <p>Klik tercatat sebagai <b>statistik</b> untuk kreator <b id="u"></b>. Mengalihkan ke produk lewat jaringan afiliasi…</p>
  <p class="mut" id="dest"></p>
</div>
<script>
// Pembungkus link sistem:
// 1) catat KLIK ke server (statistik saja — tidak bernilai komisi, anti-fraud)
// 2) minta server membungkus URL ke format jaringan afiliasi (deeplink + Sub-ID pengguna)
// 3) redirect ke tujuan — komisi lahir hanya jika jaringan mengonfirmasi pembelian (postback)
(function(){
  const p = new URLSearchParams(location.search);
  const u = p.get('u') || '-', c = p.get('c') || 'produk', r = p.get('r') || '';
  document.getElementById('u').textContent = u;
  document.getElementById('dest').textContent = r;
  if(!r || !/^https?:\/\//i.test(r)){
    document.getElementById('dest').innerHTML = 'URL tujuan tidak valid. <a href="index.html">Kembali</a>';
    return;
  }
  try{
    fetch('/api/click', { method: 'POST', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kode: u, kanal: c, url: r }) }).catch(()=>{});
  }catch(e){}
  // bungkus via template jaringan afiliasi bila dikonfigurasi admin; fallback URL asli
  fetch('/api/deeplink?url=' + encodeURIComponent(r) + '&subid=' + encodeURIComponent(u))
    .then(x=>x.json()).then(j=>{
      const dest = (j && j.finalUrl) ? j.finalUrl : r;
      setTimeout(()=>location.replace(dest), 900);
    }).catch(()=>setTimeout(()=>location.replace(r), 900));
})();
</script>
</body>
</html>
