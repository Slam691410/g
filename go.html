<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><title>GHub One — Mengalihkan…</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:system-ui;background:#0b0f1a;color:#e8edf9;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.box{text-align:center;max-width:420px;padding:24px}.logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#5b8cff,#a97aff);display:inline-flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;margin-bottom:14px}
.mut{color:#8b96b5;font-size:13px;margin-top:10px;word-break:break-all}a{color:#7aa2ff}</style>
</head>
<body>
<div class="box">
  <div class="logo">G</div>
  <h2>Link afiliasi GHub One</h2>
  <p>Klik tercatat — komisi untuk kreator <b id="u"></b> &amp; sistem. Mengalihkan ke tujuan…</p>
  <p class="mut" id="dest"></p>
</div>
<script>
// Pembungkus link sistem: catat klik (komisi user + sistem) lalu redirect ke URL produk asli.
(function(){
  const p = new URLSearchParams(location.search);
  const u = p.get('u') || '-', c = p.get('c') || 'produk', r = p.get('r') || '';
  document.getElementById('u').textContent = u;
  document.getElementById('dest').textContent = r;
  try{
    const led = JSON.parse(localStorage.getItem('ghub_ledger') || '[]');
    led.unshift({ id: Math.random().toString(36).slice(2,10), at: new Date().toISOString(),
      tipe: 'klik-afiliasi', kanal: c, kode: u, url: r, status: 'klik tercatat' });
    localStorage.setItem('ghub_ledger', JSON.stringify(led));
  }catch(e){}
  if(r && /^https?:\/\//i.test(r)) setTimeout(()=>location.replace(r), 1200);
  else document.getElementById('dest').innerHTML = 'URL tujuan tidak valid. <a href="index.html">Kembali</a>';
})();
</script>
</body>
</html>
